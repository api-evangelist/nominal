    command: cargo install --git https://github.com/nominal-io/nominal-client-rs
  description: First-party Nominal command-line tool. Manages Nominal connection profiles
    (base URL + API key + workspace) stored on disk at ~/.config/nominal/config.yml,
    so credentials are not embedded in scripts, and provides access to Nominal Core
    test data storage & compute from the terminal.
  key_flows:
