aid: nominal
name: Nominal
description: 'Nominal is the unified software suite for testing and operating advanced
  hardware — flight systems, satellites, robotics, energy, and other mission-critical
  engineering programs. Nominal Core is a collaborative workspace that captures, monitors,
  and analyzes multimodal test data (telemetry, logs, video, and simulation results)
  across datasets, runs, assets, channels, workbooks, and checklists, while Nominal
  Connect runs at the edge to read from and write to instruments in real time from
  Python. Nominal exposes an open Conjure-based REST API at api.gov.nominal.io/api,
  with first-party SDKs for Python, Rust (and the nom CLI), Go, and LabVIEW, plus a
  documentation MCP server for AI clients. Backed by Founders Fund, General Catalyst,
  Lightspeed Venture Partners, and Lux Capital.'
